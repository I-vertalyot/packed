      showUndo(T.undoUnchecked,()=>{const tr=state.trips.find(x=>x.id===tid);if(tr){tr.packed=prev;ui.lastPack=null;save();render()}});break}
    case 'info':toggleAppMenu(false);ui.help=true;render();{const c=document.getElementById('helpClose');if(c)c.focus()}return;
    case 'help-close':ui.help=false;render();document.getElementById('infoBtn').focus();return;
    case 'help-go':helpGo(b.dataset.v);return;
    case 'trip-menu':toggleTripMenu();return;
    case 'cp-open':{const pop=b.parentElement.querySelector('.cp-pop'),open=pop.hidden;closeCatPops();if(open){pop.hidden=false;b.setAttribute('aria-expanded','true');const s=pop.querySelector('[aria-selected="true"]')||pop.firstElementChild;s.focus({preventScroll:true})}return}
    case 'qa-cat':{const sel=document.getElementById(b.dataset.pre+'-cat');if(sel){sel.value=b.dataset.v;sel.dispatchEvent(new Event('change',{bubbles:true}))}return}
    case 'quick-add':{const pre=b.dataset.pre,inp=document.getElementById(pre==='ad'?'search':'invsearch'),nm=document.getElementById(pre+'-name'),f=document.getElementById(pre==='ad'?'addToDay':'addItem');
      if(!inp||!nm||!f)return;nm.value=inp.value.trim().replace(/\s+/g,' ');if(!nm.value)return;f.requestSubmit();return}
    case 'cp-pick':{const sel=document.getElementById(b.dataset.pre+'-cat');closeCatPops();if(sel){sel.value=b.dataset.v;sel.dispatchEvent(new Event('change',{bubbles:true}))}const btn=b.closest('.catpick').querySelector('.cp-btn');if(btn&&b.dataset.v!=='__new')btn.focus({preventScroll:true});return}
    case 'tut-next':if(ui.tut===T.tut.length-1)closeTut();else tutGo(ui.tut+1);return;
    case 'tut-back':tutGo(ui.tut-1);return;
    case 'tut-dot':tutGo(+b.dataset.v);return;
    case 'tut-skip':closeTut();return;
    case 'tut-lang':{const to=b.dataset.v;if(to!==lang()){translateStarter(to);state.lang=to;save();render();renderTut(0)}return}
    case 'tut-again':ui.help=false;render();openTut();return;
    case 'export':exportBackup(false);return;
    case 'export-inv':exportBackup(true);return;
    case 'export-inv-send':sendInventory();return;
    case 'inv-yes':if(pendingInv){mergeInv(pendingInv);pendingInv=null;ui.importMsg='invImported';save()}break;
    case 'inv-no':pendingInv=null;ui.importMsg='';break;
    case 'import-pick':document.getElementById('importFile').click();return;
    case 'import-yes':if(pendingImport){state=pendingImport;pendingImport=null;ui.tripId=null;ui.importMsg='imported';save()}break;
    case 'import-no':pendingImport=null;ui.importMsg='';break;
    case 'edit-trip':ui.editFromHome=false;ui.editTrip=true;ui.editVals=null;ui.editErr='';ui.editWarn=0;ui.delTrip=false;break;
    case 'edit-cancel':ui.delTrip=false;ui.editTrip=false;ui.editId=null;ui.editVals=null;ui.editErr='';ui.editWarn=0;break;
    case 'dup-trip':{toggleTripMenu(false);const src=trip();if(!src)return;
      const cp={...JSON.parse(JSON.stringify(src)),id:uid(),name:src.name+T.copySuffix,packed:{},created:Date.now()};
      state.trips.push(cp);ui.tripId=null;ui.share=false;ui.mode='days';ui.editId=cp.id;ui.editVals=null;save();render();window.scrollTo(0,0);return}
    case 'del-trip':toggleTripMenu(false);ui.delTrip=true;render();requestAnimationFrame(()=>{const c=document.querySelector('#delModal [data-act="del-trip-no"]');if(c)c.focus({preventScroll:true})});return;
    case 'del-trip-no':ui.delTrip=false;break;
    case 'inv-clear-ask':ui.invClear=true;render();requestAnimationFrame(()=>{const c=document.querySelector('#invClearModal [data-act="inv-clear-no"]');if(c)c.focus({preventScroll:true})});return;
    case 'inv-clear-no':ui.invClear=false;break;
    case 'inv-clear-yes':{const snap=JSON.stringify({items:state.items,cats:state.cats,trips:state.trips.map(x=>({id:x.id,picks:x.picks,packed:x.packed}))});
      state.items=[];state.cats=[];state.trips.forEach(x=>{x.picks={all:{}};x.packed={}});ui.invClear=false;save();
      showUndo(T.undoInvCleared,()=>{const o=JSON.parse(snap);state.items=o.items;state.cats=o.cats;o.trips.forEach(b=>{const x=state.trips.find(y=>y.id===b.id);if(x){x.picks=b.picks;x.packed=b.packed}});save();render()});break}
    case 'del-trip-yes':{const did=ui.editId||ui.tripId,idx=state.trips.findIndex(x=>x.id===did),gone=state.trips[idx];state.trips=state.trips.filter(x=>x.id!==did);ui.tripId=null;ui.editId=null;ui.editVals=null;ui.delTrip=false;ui.share=false;save();break}
    case 'pick-color':ui.colorCat=ui.colorCat===b.dataset.c?null:b.dataset.c;break;
    case 'set-color':state.catColors=state.catColors||{};state.catColors[b.dataset.c]=b.dataset.v;ui.colorCat=null;save();break;
    case 'newcat-cancel':ui.newCatFor=null;break;
    case 'del-item':ui.delItem=id;break;
    case 'del-item-no':ui.delItem=null;break;
    case 'del-item-yes':state.items=state.items.filter(i=>i.id!==id);state.trips.forEach(tr=>{Object.values(tr.picks).forEach(p=>{if(p)delete p[id]});delete tr.packed[id]});ui.delItem=null;save();break;
    default:return;
  }
  const y=window.scrollY;const anchorSel=(a==='toggle-pick'||a==='foldall'||a==='fold')&&b.dataset?(a==='toggle-pick'?`[data-act="toggle-pick"][data-id="${b.dataset.id}"]`:a==='foldall'?`[data-act="foldall"][data-v="${b.dataset.v}"]`:`[data-act="fold"][data-v="${b.dataset.v}"][data-c="${CSS.escape(b.dataset.c||'')}"]`):null;
  const anchorTop=anchorSel?b.getBoundingClientRect().top:0;
  render();
  window.scrollTo(0,(a==='open-trip'||a==='tab'||a==='back')?0:y);
  if(anchorSel){const el=main.querySelector(anchorSel);if(el)window.scrollBy(0,el.getBoundingClientRect().top-anchorTop)}
});

document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;const fd=new FormData(f);
  if(f.id==='editTrip'){const t=ui.editId?state.trips.find(x=>x.id===ui.editId):trip();if(!t)return;
    const name=String(fd.get('name')).trim(),st=String(fd.get('start')),en=String(fd.get('end'));
    ui.editVals={name,start:st,end:en};ui.editErr='';
    if(!name||!st||!en)return;
    if(en<st){ui.editErr='errOrder';ui.editWarn=0;render();return}
    if(Math.round((parseD(en)-parseD(st))/864e5)>59){ui.editErr='errLong';ui.editWarn=0;render();return}
    const drop=droppedDays(t,st,en);
    if(drop&&ui.editWarn!==drop){ui.editWarn=drop;render();return}
    t.name=name;if(st!==t.start||en!==t.end)retime(t,st,en);
    ui.editTrip=false;ui.editId=null;ui.editVals=null;ui.editWarn=0;ui.day='all';save();render();return}
  if(f.id==='newTrip'){
    const name=String(fd.get('name')).trim(),s=fd.get('start'),en=fd.get('end');
    if(!name||!s||!en)return;
    if(en<s){ui.tripErr='errOrder';render();return}
    if(Math.round((parseD(en)-parseD(s))/864e5)>59){ui.tripErr='errLong';render();return}
    const t={id:uid(),name,start:s,end:en,picks:{all:{}},packed:{}};
    t.created=Date.now();
    state.trips.push(t);ui.newTrip=false;ui.tripErr='';save();render();
    /* stay on the home page; bring the new card into view */
    requestAnimationFrame(()=>{const el=document.querySelector('.trip[data-id="'+t.id+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})});
  }
  if(f.classList.contains('newcat')){const it=item(f.dataset.id);const v=String(fd.get('newcat')||'').trim();
    if(it&&v){it.cat=v;addCat(v);openCat('inv',v)}ui.newCatFor=null;save();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(f.id==='addItem'||f.id==='addToDay'){
    const name=String(fd.get('name')).trim();let cat=String(fd.get('cat')||'');if(cat==='__new')cat=String(fd.get('newcat')||'');cat=cat.trim()||OTHER();
    ui.lastCat=cat;
    if(!name)return;
    let it=state.items.find(i=>i.name.toLowerCase()===name.toLowerCase()&&(i.cat||OTHER())===cat);
    if(!it){it={id:uid(),name,cat};state.items.push(it);addCat(cat)}
    openCat(f.id==='addItem'?'inv':'pick',cat);
    if(f.id==='addToDay'){if(ui.day==='all')ui.wholeKeep=true;const t=trip();setPick(t,ui.day,it.id,Math.max(1,(t.picks[ui.day]||{})[it.id]||0))}
    const fBefore=f.getBoundingClientRect().top;save();const y=window.scrollY;render();window.scrollTo(0,y);
    {const nf=document.getElementById(f.id);if(nf)window.scrollBy(0,nf.getBoundingClientRect().top-fBefore)}
    const again=document.getElementById(f.id==='addItem'?'ai-name':'ad-name');if(again)again.focus();
  }
});

document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='ad-cat'||el.id==='ai-cat')setTimeout(()=>quickAdd(el.id.slice(0,2)),0);
  if(el.classList.contains('recat-sel')){const it=item(el.dataset.id);if(!it)return;
    if(el.value==='__new'){ui.newCatFor=it.id;const y=window.scrollY;render();window.scrollTo(0,y);const n=document.getElementById('nc-'+it.id);if(n)n.focus();return}
    it.cat=el.value;openCat('inv',el.value);save();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(el.id==='ai-cat'||el.id==='ad-cat'){const pre=el.id.slice(0,2);const n=document.getElementById(pre+'-newcat');
    if(n){n.hidden=el.value!=='__new';n.required=el.value==='__new';if(el.value==='__new')n.focus()}
    {const cp=el.closest('.catpick');cp.querySelector('.cp-label').textContent=el.value==='__new'?T.newCatOpt:el.value;cp.querySelectorAll('.cp-opt').forEach(o=>o.setAttribute('aria-selected',o.dataset.v===el.value))}
    if(el.value!=='__new'){ui.lastCat=el.value;el.closest('.catpick').style.setProperty('--cc',`var(--c-${catColor(el.value)})`)}return}
  if(el.id==='importFile'){if(el.files&&el.files[0])readImport(el.files[0]);el.value='';return}
  if(el.dataset&&'hidepacked' in el.dataset){state.hidePacked=el.checked;save();render();return}
  if(el.dataset&&el.dataset.pack){const t=trip();if(el.checked||el.dataset.partial)t.packed[el.dataset.pack]=true;else delete t.packed[el.dataset.pack];save();const y=window.scrollY;ui.patch=true;render();window.scrollTo(0,y);return}
  if(el.classList.contains('rename')){const it=item(el.dataset.id);const v=el.value.trim();if(it&&v&&v!==it.name){it.name=v;save()}else if(it)el.value=it.name;return}
  if(el.classList.contains('recat')){const it=item(el.dataset.id);const v=el.value.trim()||OTHER();if(it&&v!==it.cat){it.cat=v;addCat(v);save();const y=window.scrollY;render();window.scrollTo(0,y)}return}
});

let holoBack=null;
function openHolo(from){holoBack=from||null;holo.classList.remove('on','off');holo.hidden=false;void holo.offsetWidth;holo.classList.add('on');
  document.documentElement.style.overflow='hidden';setTimeout(()=>{if(!holo.hidden)document.getElementById('holoBtn').focus({preventScroll:true})},1700)}
function closeHolo(){if(holo.hidden)return;holo.classList.add('off');
  setTimeout(()=>{holo.hidden=true;holo.classList.remove('on','off');document.documentElement.style.overflow='';if(holoBack&&holoBack.isConnected)holoBack.focus({preventScroll:true})},250)}
holo.addEventListener('click',e=>{if(e.target.closest('.holo-x')||e.target.classList.contains('holo-bg')||e.target===holo||e.target.classList.contains('holo-stage'))closeHolo()});
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('.ig');if(a){e.stopPropagation();openHolo(a)}},true);

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!holo.hidden){closeHolo();return}if(e.key==='Escape'&&ui.help){ui.help=false;render();document.getElementById('infoBtn').focus()}});

document.addEventListener('input',e=>{
  if(e.target.id==='et-start'||e.target.id==='et-end'){ui.editWarn=0;return}
  if(e.target.id==='invsearch'){const q=e.target.value.trim().toLowerCase();
    main.querySelectorAll('.cat.cardcat').forEach(c=>{let any=false;c.querySelectorAll('.inv').forEach(r=>{const n=(r.querySelector('.rename')||{}).value||'';const m=!q||n.toLowerCase().includes(q);r.hidden=!m;if(m)any=true});c.hidden=!any;c.classList.toggle('force',!!q)});quickAdd('ai');return}
  if(e.target.id!=='search')return;
  const q=e.target.value.trim().toLowerCase();
  main.querySelectorAll('[data-cat]').forEach(c=>{let any=false;c.querySelectorAll('.chip').forEach(ch=>{const m=!q||ch.dataset.name.includes(q);ch.hidden=!m;if(m)any=true});c.hidden=!any;c.classList.toggle('force',!!q)});
  quickAdd('ad');
});
/* search that finds no exact match offers to add it straight away, into the category picked in the add row */
function qaCats(pre,sel,cur){if(!sel)return'';const opts=[...sel.options].filter(o=>o.value&&o.value!=='__new');if(opts.length<2)return'';
  return `<div class="qa-cats" role="group" aria-label="${esc(T.qaPick)}"><span class="qa-cl">${esc(T.qaPick)}</span>${opts.map(o=>`<button type="button" class="qa-c${o.value===cur?' on':''}" data-act="qa-cat" data-pre="${pre}" data-v="${esc(o.value)}" aria-pressed="${o.value===cur}" style="--cc:var(--c-${catColor(o.value)})"><i class="dot"></i>${esc(o.value)}</button>`).join('')}</div>`}
function quickAdd(pre){
  const box=document.getElementById('qa-'+pre),inp=document.getElementById(pre==='ad'?'search':'invsearch');if(!box||!inp)return;
  const raw=inp.value.trim().replace(/\s+/g,' ');
  const exact=raw&&state.items.some(i=>i.name.toLowerCase()===raw.toLowerCase());
  if(!raw||exact){box.hidden=true;box.innerHTML='';return}
  const sel=document.getElementById(pre+'-cat');let cat=sel?sel.value:'';
  if(!cat||cat==='__new'){const nc=document.getElementById(pre+'-newcat');cat=(nc&&nc.value.trim())||OTHER()}
  const none=pre==='ad'?!main.querySelector('[data-cat]:not([hidden])'):!main.querySelector('.cat.cardcat:not([hidden])');
  box.hidden=false;
  box.innerHTML=`${none?`<p class="qa-none">${esc(T.noFound)}</p>`:''}<button type="button" class="btn qa-btn" data-act="quick-add" data-pre="${pre}"><span class="qa-plus" aria-hidden="true">+</span><span class="qa-txt">${esc(T.qaPre)} <b>“${esc(raw)}”</b> ${esc(T.qaTo)}</span><span class="qa-cat" style="--cc:var(--c-${catColor(cat)})">${esc(cat)}</span></button>${qaCats(pre,sel,cat)}`;
}

/* gentle haptic tick on taps: Android vibrates briefly; iPhone (Safari 17.4+) gets the system tick via a hidden switch */
(function(){
  const canVib=typeof navigator.vibrate==='function';
  const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  let sw=null,last=0;
  if(!canVib&&isIOS){sw=document.createElement('label');sw.setAttribute('aria-hidden','true');sw.style.cssText='position:fixed;left:-99px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden';sw.innerHTML='<input type="checkbox" switch tabindex="-1">';document.body.appendChild(sw)}
  const ITEM=/^(toggle-pick|pk-inc|pk-dec|qty|rm-pick|cp-pick|set-color)$/;
  function tick(ms){const now=Date.now();if(now-last<40)return;last=now;
    try{if(canVib)navigator.vibrate(ms);else if(sw){const a=document.activeElement;sw.click();if(a&&a!==document.body&&a.focus&&/^(INPUT|TEXTAREA)$/.test(a.tagName))a.focus({preventScroll:true})}}catch(e){}}
  document.addEventListener('click',e=>{
    if(sw&&sw.contains(e.target))return;
    const el=e.target.closest&&e.target.closest('button,[data-act],input[type=checkbox],input[type=radio],label,a,summary,.trip');
    if(!el||el.disabled)return;
    const act=el.getAttribute('data-act')||'';
    tick(ITEM.test(act)||el.matches('input[type=checkbox],label')?28:20);
  },true);
})();
/* swipe sideways inside a trip to switch Collecting <-> Packing */
(function(){
  let sx=0,sy=0,st=0,ok=false;
  const blocked=el=>!!(el.closest&&el.closest('input,textarea,select,.cp-pop,.menu-pop,.modal,[aria-modal="true"],.tut,#help,.help,.pstep,.hp-sw'));
  document.addEventListener('touchstart',e=>{ok=false;if(e.touches.length!==1||!ui.tripId||ui.share||ui.editId||ui.clearAsk||ui.delTrip)return;
    const t=e.touches[0];if(t.clientX<24||t.clientX>innerWidth-24)return;/* leave the screen edges to the phone's back gesture */
    if(blocked(e.target))return;sx=t.clientX;sy=t.clientY;st=Date.now();ok=true},{passive:true});
  document.addEventListener('touchend',e=>{if(!ok)return;ok=false;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Date.now()-st>700||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.7)return;
    const to=dx<0?'pack':'days';if(ui.mode===to)return;
    const btn=document.querySelector('.modebar [data-act="mode"][data-v="'+to+'"]');if(btn)btn.click();
  },{passive:true});
  document.addEventListener('touchcancel',()=>{ok=false},{passive:true});
})();
/* deep-space starfield in the header: stars stream toward you, softly, at low cost */
window.startSpace=cv=>{if(!cv||!cv.getContext||cv.__space)return;cv.__space=1;(function(){
  const cx=cv.getContext('2d');
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,D=1,stars=[],raf=0,last=0;
  const tints=['255,255,255','255,255,255','210,225,255','255,236,210','190,255,245'];
  const mk=z=>({x:(Math.random()*2-1),y:(Math.random()*2-1),z:z==null?Math.random():z,t:tints[Math.random()*tints.length|0],px:null,py:null});
  function size(){const r=cv.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=W*D|0;cv.height=H*D|0;cx.setTransform(D,0,0,D,0,0);
    const n=Math.round(Math.min(420,W*H/190));while(stars.length<n)stars.push(mk());stars.length=n;if(still)draw(0)}
  function draw(dt){cx.clearRect(0,0,W,H);const fx=W*0.62,fy=H*0.55,f=Math.max(W,H)*0.55,sp=dt*0.00006;
    for(const s of stars){
      if(!still){s.z-=sp*(0.6+0.4*(1-s.z));}
      if(s.z<=0.02){Object.assign(s,mk(1));continue}
      const sx=fx+s.x/s.z*f*0.5,sy=fy+s.y/s.z*f*0.5;
      if(sx<-20||sx>W+20||sy<-20||sy>H+20){Object.assign(s,mk(1));continue}
      const k=1-s.z,a=Math.min(1,0.3+k*1.2),rad=0.25+k*0.9;
      if(s.px!=null&&!still&&k>0.35){cx.strokeStyle='rgba('+s.t+','+(a*0.55)+')';cx.lineWidth=rad*0.9;cx.beginPath();cx.moveTo(s.px,s.py);cx.lineTo(sx,sy);cx.stroke()}
      cx.fillStyle='rgba('+s.t+','+a+')';cx.beginPath();cx.arc(sx,sy,rad,0,6.283);cx.fill();
      s.px=sx;s.py=sy}}
  function loop(t){const dt=last?Math.min(50,t-last):16;last=t;draw(dt);raf=requestAnimationFrame(loop)}
  function start(){if(still||raf||document.hidden)return;last=0;raf=requestAnimationFrame(loop)}
  function stop(){cancelAnimationFrame(raf);raf=0}
  size();if('ResizeObserver' in window)new ResizeObserver(size).observe(cv);else addEventListener('resize',size);
  document.addEventListener('visibilitychange',()=>document.hidden?stop():start());start();
})()};
document.querySelectorAll('canvas.space').forEach(cv=>window.startSpace(cv));
/* date fields show "11 Nov 2026" (day month year) whatever the phone's own date format; picking a start date sets the end to the next day */
function fmtDateInputs(root){(root||document).querySelectorAll('input[type=date]').forEach(inp=>{
  let w=inp.parentElement;if(!w.classList.contains('datef')){w=document.createElement('span');w.className='datef';inp.parentNode.insertBefore(w,inp);w.appendChild(inp);const t=document.createElement('span');t.className='dtxt';t.setAttribute('aria-hidden','true');w.appendChild(t);inp.classList.add('dfmt')}
  const t=w.querySelector('.dtxt'),v=inp.value?dmy(inp.value):'';if(t.textContent!==v)t.textContent=v})}
new MutationObserver(ms=>{if(ms.some(m=>[...m.addedNodes].some(n=>n.nodeType===1&&(n.matches('input[type=date]')||n.querySelector&&n.querySelector('input[type=date]:not(.dfmt)')))))fmtDateInputs()}).observe(document.body,{childList:true,subtree:true});
document.addEventListener('input',e=>{const el=e.target;if(!(el instanceof HTMLInputElement)||el.type!=='date')return;
  if(/-start$/.test(el.id)&&el.value){const end=document.getElementById(el.id.replace(/start$/,'end'));if(end){const d=parseD(el.value);d.setDate(d.getDate()+1);const v=iso(d);if(end.value!==v){end.value=v;end.dispatchEvent(new Event('input',{bubbles:true}));end.dispatchEvent(new Event('change',{bubbles:true}))}}}
  fmtDateInputs()},true);
document.addEventListener('change',e=>{if(e.target&&e.target.type==='date')fmtDateInputs()},true);
document.addEventListener('click',e=>{const w=e.target.closest&&e.target.closest('.datef');if(!w)return;const inp=w.querySelector('input');try{inp.showPicker&&inp.showPicker()}catch(_){}} ,true);
fmtDateInputs();
render();
/* the intro tutorial no longer opens by itself on first start; it stays available from the help screen ("Show the tutorial") */
connect();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){const had=!!navigator.serviceWorker.controller;let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;try{saveOnLeave()}catch(e){}location.reload()}});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{try{r.update()}catch(e){}}).catch(()=>{})}
})();
